<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Board Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <header class="panel-head">
          <h1>任务进度看板 Demo</h1>
          <p>模拟交互：增减进度、切换状态、完成率统计。</p>
        </header>

        <div class="progress-wrap">
          <div class="progress-rail">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <p id="progressText" class="progress-text">完成度 0%</p>
        </div>

        <div class="cards" id="cards"></div>

        <div class="actions">
          <button id="addBtn" type="button">新增任务</button>
          <button id="toggleAllBtn" type="button">全部切换状态</button>
          <button id="resetBtn" type="button">重置</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>

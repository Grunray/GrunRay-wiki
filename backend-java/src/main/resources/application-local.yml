# 本机对照 Flask 开发库：自行导出 MYSQL_* 与 CONTENT_ROOT（绝对路径）。
# java -jar grunray-wiki-api.jar --spring.profiles.active=local
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:grunray_wiki}?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci

grunray:
  content-root: ${CONTENT_ROOT}

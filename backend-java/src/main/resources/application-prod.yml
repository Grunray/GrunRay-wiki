# 生产占位。密钥与主机只来自环境变量，仓库不放真实值。
# 启动不跑 Flyway。迁移入口是 tech.grunray.wiki.ops.FlywayTool，且库名必须是隔离库。
server:
  address: 127.0.0.1
  port: ${PORT:5000}

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

grunray:
  content-root: ${CONTENT_ROOT}
  cors-origins: ${CORS_ORIGINS}

<!doctype html>
<html lang="zh-Hans" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- 静态兜底 SEO meta：给不执行 JS 的爬虫/社媒卡片抓取默认值；
         运行时 useSeoMeta(@unhead) 会按当前页覆盖为页面级精确值（同 key 标签被 reconcile，不重复） -->
    <meta name="description" content="个人成果与笔记：项目、开发记录与算法心得。" />
    <link rel="canonical" href="https://grunray.tech/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GrunRay" />
    <meta property="og:title" content="GrunRay" />
    <meta property="og:description" content="个人成果与笔记：项目、开发记录与算法心得。" />
    <meta property="og:url" content="https://grunray.tech/" />
    <meta property="og:image" content="https://grunray.tech/favicon.jpg" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GrunRay" />
    <meta name="twitter:description" content="个人成果与笔记：项目、开发记录与算法心得。" />
    <meta name="twitter:image" content="https://grunray.tech/favicon.jpg" />
    <!-- 自托管字体：去 Google Fonts 外链（国内访问稳定、不依赖外部）；@font-face 用 display:swap，系统字体先排版 -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="GrunRay 博客 RSS"
      href="/rss.xml"
    />
    <title>GrunRay</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

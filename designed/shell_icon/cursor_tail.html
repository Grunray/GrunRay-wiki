<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>流星图标预览</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
      margin: 0;
    }
    .icon {
      width: 120px;
      height: 120px;
      color: #000; /* 改这里就能换颜色 */
    }
  </style>
</head>
<body>

<!-- 你要的 纯流星 SVG（无xmlns、纯path、currentColor） -->
<svg class="icon" viewBox="0 0 100 100">
  <path fill="currentColor" d="M45 25 L50 50 L75 55 L50 60 L45 85 L40 60 L15 55 L40 50 Z" />
  <path fill="none" stroke="currentColor" stroke-width="8" d="M70 40 L95 20" />
  <path fill="none" stroke="currentColor" stroke-width="8" d="M70 50 L100 30" />
  <path fill="none" stroke="currentColor" stroke-width="8" d="M70 60 L95 50" />
</svg>

</body>
</html>

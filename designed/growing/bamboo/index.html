<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Bamboo with Realistic Branches</title>
<style>
    :root {
        /* 新中式美化颜色 - 使用变量方便调整 */
        --bamboo-stalk-light: #7cb83e;  /* 竹干正面高光 */
        --bamboo-stalk-mid: #4b7e21;    /* 竹干过渡 */
        --bamboo-stalk-dark: #2e4d15;   /* 竹干暗部 */
        --bamboo-node-light: #a3d977;   /* 竹节上部 */
        --bamboo-node-dark: #1d330c;    /* 竹节下部 */
        --bamboo-branch: #1d330c;       /* 枝条深绿 */
        --bamboo-leaf-light: #7cb83e;   /* 叶片亮绿 */
        --bamboo-leaf-dark: #3a6318;    /* 叶片深绿 */
        --sun-color: rgba(255, 255, 255, 0.6);
        --background-1: #e0e5db;
        --background-2: #b5c0a9;
        --background-3: #859675;
    }

    /* 禅意背景 - 保持静态 */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        background: radial-gradient(circle at 50% 40%, var(--background-1) 0%, var(--background-2) 60%, var(--background-3) 100%);
        overflow: hidden;
    }

    /* 太阳/月亮 点缀 */
    .sun {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 150px;
        background-color: var(--sun-color);
        border-radius: 50%;
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
        z-index: 0;
    }

    /* 竹子主容器 - 去掉了摇摆动画 */
    .bamboo-wrapper {
        position: relative;
        z-index: 1;
        height: 80vh;
        width: 40px;
        transform-origin: bottom center;
    }

    /* 竹子躯干：进一步优化光影渐变和圆柱感 */
    .bamboo-stalk {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            to right,
            var(--bamboo-stalk-dark) 0%,     /* 左侧暗部 */
            var(--bamboo-stalk-mid) 20%,     /* 左侧过渡 */
            var(--bamboo-stalk-light) 50%,   /* 正面高光 */
            var(--bamboo-stalk-mid) 80%,     /* 右侧过渡 */
            var(--bamboo-stalk-dark) 100%    /* 右侧极暗部 */
        );
        border-radius: 10px 10px 0 0;
        box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
    }

    /* 竹节：优化凹凸感和立体感 */
    .node {
        position: absolute;
        width: 116%;
        height: 10px;
        background: linear-gradient(to bottom, var(--bamboo-node-light) 0%, var(--bamboo-stalk-mid) 40%, var(--bamboo-node-dark) 100%);
        left: -8%;
        border-radius: 50%;
        box-shadow: 0 -2px 3px rgba(255, 255, 255, 0.2), 0 3px 5px rgba(0, 0, 0, 0.3);
    }

    /* 精确分布竹节 - 增加了一个 */
    .node:nth-child(1) { bottom: 15%; }
    .node:nth-child(2) { bottom: 35%; }
    .node:nth-child(3) { bottom: 58%; }
    .node:nth-child(4) { bottom: 80%; }
    .node:nth-child(5) { bottom: 95%; }

    /* --- 新增：静态枝条和现实叶簇 --- */

    /* 枝条主轴容器 */
    .branch-fork {
        position: absolute;
        width: 0;
        height: 0;
        transform-origin: left bottom;
        z-index: -1; /* 放在竹干和竹节后面 */
    }

    /* 具体枝条定位 */
    .branch-lower {
        bottom: 58%; /* 起始于第三个竹节 */
        left: 100%; /* 从竹干右侧伸出 */
        transform: rotate(-15deg);
    }

    .branch-upper {
        bottom: 80%; /* 起始于第四个竹节 */
        left: 100%; /* 从竹干右侧伸出 */
        transform: rotate(-25deg);
    }

    /* 枝条茎干 */
    .branch-stem {
        position: absolute;
        background: var(--bamboo-branch);
    }

    .stem-left {
        width: 60px;
        height: 3px;
        left: 0;
        bottom: 0;
    }

    .stem-right {
        width: 80px;
        height: 3px;
        left: 0;
        bottom: 0;
    }

    /* 叶簇：容纳多片叶子，模拟簇状生长 */
    .leaf-cluster {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: -5px; /* 让叶子重叠，更有层次感 */
        transform-origin: bottom center;
    }

    /* 单片叶子基类 - 去掉了抖动动画 */
    .leaf {
        position: relative;
        width: 70px;
        height: 20px;
        border-radius: 100% 0 100% 0; /* 椭圆圆角生成叶片形状 */
        background: linear-gradient(135deg, var(--bamboo-leaf-light) 0%, var(--bamboo-leaf-dark) 100%);
        box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        transform-origin: 0 100%; /* 以叶片根部为旋转中心 */
    }

    /* --- 静态定位叶片和簇，增加数量和现实分叉形态 --- */

    /* 下部枝条叶簇定位 */
    .cluster-left-main {
        bottom: 0;
        left: 60px; /* 连接到茎干末端 */
        transform: rotate(5deg);
    }
    .cluster-left-main .leaf:nth-child(1) { width: 80px; height: 22px; transform: rotate(0deg); }
    .cluster-left-main .leaf:nth-child(2) { width: 60px; height: 18px; transform: rotate(20deg) translateY(-8px); }
    .cluster-left-main .leaf:nth-child(3) { width: 50px; height: 15px; transform: rotate(40deg) translateY(-15px); }

    .cluster-left-sub {
        bottom: 0;
        left: 30px; /* 在茎干中途分叉 */
        transform: rotate(-10deg) translateY(5px);
    }
    .cluster-left-sub .leaf:nth-child(1) { width: 60px; height: 18px; transform: rotate(0deg); }
    .cluster-left-sub .leaf:nth-child(2) { width: 40px; height: 12px; transform: rotate(-30deg) translateY(5px); }

    /* 上部枝条叶簇定位 */
    .cluster-right-main {
        bottom: 0;
        left: 80px; /* 连接到茎干末端 */
        transform: rotate(10deg);
    }
    .cluster-right-main .leaf:nth-child(1) { width: 90px; height: 25px; transform: rotate(0deg); }
    .cluster-right-main .leaf:nth-child(2) { width: 70px; height: 20px; transform: rotate(20deg) translateY(-5px); }
    .cluster-right-main .leaf:nth-child(3) { width: 50px; height: 15px; transform: rotate(40deg) translateY(-10px); }
    .cluster-right-main .leaf:nth-child(4) { width: 40px; height: 12px; transform: rotate(60deg) translateY(-15px); }

    .cluster-right-sub {
        bottom: 0;
        left: 40px; /* 在茎干中途分叉 */
        transform: rotate(-5deg) translateY(8px);
    }
    .cluster-right-sub .leaf:nth-child(1) { width: 70px; height: 20px; transform: rotate(0deg); }
    .cluster-right-sub .leaf:nth-child(2) { width: 50px; height: 15px; transform: rotate(-20deg) translateY(5px); }
    .cluster-right-sub .leaf:nth-child(3) { width: 40px; height: 12px; transform: rotate(-40deg) translateY(10px); }
</style>
</head>
<body>

    <div class="sun"></div>

    <div class="bamboo-wrapper">
        <div class="bamboo-stalk">
            <div class="node"></div>
            <div class="node"></div>
            <div class="node"></div>
            <div class="node"></div>
            <div class="node"></div>

            <div class="branch-fork branch-lower">
                <div class="branch-stem stem-left"></div>
                <div class="leaf-cluster cluster-left-main">
                    <div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>
                </div>
                <div class="leaf-cluster cluster-left-sub">
                    <div class="leaf"></div><div class="leaf"></div>
                </div>
            </div>

            <div class="branch-fork branch-upper">
                <div class="branch-stem stem-right"></div>
                <div class="leaf-cluster cluster-right-main">
                    <div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>
                </div>
                <div class="leaf-cluster cluster-right-sub">
                    <div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>
                </div>
            </div>
        </div>
    </div>

<!DOCTYPE html>

<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>GrunRay Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Playfair Display', Georgia, serif;
    }


body {
  background: #aebfc2;
  height: 100vh;
  overflow: hidden;
}

/* 顶部导航 */
.navbar {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(10px);
}

.nav-left {
  font-weight: bold;
  font-size: 20px;
}

.nav-center span {
  margin: 0 15px;
  cursor: pointer;
  opacity: 0.7;
}

.nav-center span:hover {
  opacity: 1;
}

/* 主体布局 */
.container {
  display: flex;
  height: calc(100vh - 60px);
  padding: 20px;
  gap: 20px;
}

/* 左侧信息区 */
.left {
  width: 25%;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 20px;
}

.card h3 {
  margin-bottom: 10px;
}

.tags span {
  display: inline-block;
  padding: 4px 10px;
  margin: 4px;
  background: #dbe7ea;
  border-radius: 8px;
  font-size: 12px;
}

/* 中间区域 */
.center {
  width: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.avatar {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid rgba(255,255,255,0.6);
}

.avatar img {
  width: 100%;
}

.slogan {
  font-size: 20px;
  opacity: 0.8;
}

/* 外部链接 */
.links {
  display: flex;
  gap: 20px;
}

.link-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
}

.link-btn:hover {
  transform: translateY(-5px);
}

/* 音乐播放器 */
.player {
  margin-top: auto;
  width: 80%;
  text-align: center;
}

.player button {
  margin-top: 10px;
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* 右侧图片流 */
.right {
  width: 20%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.right img {
  width: 100%;
  border-radius: 10px;
  transition: 0.3s;
}

.right img:hover {
  transform: scale(1.05);
}

/* 隐藏滚动条 */
.right::-webkit-scrollbar {
  display: none;
}
.right {
  scrollbar-width: none;
}


  </style>
</head>

<body>

  <!-- 顶部 -->

  <div class="navbar">
    <div class="nav-left">GrunRay</div>
    <div class="nav-center">
      <span>首页</span>
      <span>项目</span>
      <span>博客</span>
      <span>算法</span>
    </div>
  </div>

  <!-- 主体 -->

  <div class="container">

```

  </div>

  <script>
    const audio = document.getElementById('audio');
    let playing = false;

    function toggle() {
      if (!audio.src) {
        alert("这里替换成你的音乐路径");
        return;
      }
      if (playing) {
        audio.pause();
      } else {
        audio.play();
      }
      playing = !playing;
    }
  </script>

</body>
</html>

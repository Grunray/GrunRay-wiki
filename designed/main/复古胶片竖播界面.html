<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>复古胶片竖播</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 200vh; /* 留出滚动空间，避免“抢滚轮” */
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: sans-serif;
    }

    .film-container {
      position: sticky;
      top: 0;
      width: 260px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .film-edge {
      width: 100%;
      height: 40px;
      background: #111;
      z-index: 2;
    }

    .film {
      position: relative;
      width: 100%;
      flex: 1;
      background: #111;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .holes {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 10px 0;
    }

    .holes.right { left: auto; right: 0; }

    .hole {
      width: 12px;
      height: 16px;
      background: white;
      border-radius: 2px;
      margin: auto;
    }

    .track {
      position: absolute;
      width: 80%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: scroll 20s linear infinite;
    }

    .track.paused {
      animation-play-state: paused;
    }

    @keyframes scroll {
      from { transform: translateY(0); }
      to { transform: translateY(-50%); }
    }

    .frame {
      width: 100%;
      height: 180px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      background: #000;
      border: 6px solid #fff;
      cursor: pointer;
    }

    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 放大查看 */
    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }

    .viewer.active {
      opacity: 1;
      pointer-events: all;
    }

    .viewer img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

  </style>
</head>
<body>

<div class="film-container">
  <div class="film-edge"></div>

  <div class="film">
    <div class="holes">
      <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
    </div>

    <div class="holes right">
      <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
    </div>

    <div class="track" id="track">
      <!-- 第一组 -->
      <div class="frame"><img src="https://picsum.photos/300/200?random=1" /></div>
      <div class="frame"><img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" /></div>
      <div class="frame"><img src="https://picsum.photos/300/200?random=3" /></div>
      <div class="frame"><img src="https://picsum.photos/300/200?random=4" /></div>

      <!-- 复制一组 -->
      <div class="frame"><img src="https://picsum.photos/300/200?random=1" /></div>
      <div class="frame"><img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" /></div>
      <div class="frame"><img src="https://picsum.photos/300/200?random=3" /></div>
      <div class="frame"><img src="https://picsum.photos/300/200?random=4" /></div>
    </div>
  </div>

  <div class="film-edge"></div>
</div>

<!-- 查看器 -->
<div class="viewer" id="viewer">
  <img id="viewerImg" />
</div>

<script>
  const track = document.getElementById('track');
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewerImg');

  // 滚轮控制（不阻止默认滚动）
  window.addEventListener('wheel', (e) => {
    const speed = e.deltaY * 0.02;
    track.style.animationDuration = Math.max(5, 20 - speed) + 's';
  });

  // 点击放大 + 暂停
  document.querySelectorAll('.frame img').forEach(img => {
    img.addEventListener('click', () => {
      viewer.classList.add('active');
      viewerImg.src = img.src;
      track.classList.add('paused');
    });
  });

  // 关闭查看
  viewer.addEventListener('click', () => {
    viewer.classList.remove('active');
    track.classList.remove('paused');
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>植物系导航栏（二级菜单概念）</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{

  --bg:#edf3f1;

  --nav-bg:rgba(248,252,249,.72);

  --text:#536861;
  --text-soft:#6f847d;

  --active:#84b391;

  --hover-bg:rgba(222,236,227,.72);

  --group-bg:rgba(242,248,244,.65);

  --border:rgba(203,220,211,.6);

  --shadow:
    0 10px 30px rgba(126,152,141,.08),
    inset 0 1px 0 rgba(255,255,255,.8);

}

body{

  width:100%;
  min-height:100vh;

  background:
    radial-gradient(circle at top left,
    rgba(210,231,218,.45), transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(201,224,211,.35), transparent 35%),

    var(--bg);

  font-family:
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

  overflow:hidden;
}

/* ========================= */
/* 漂浮背景 */
/* ========================= */

.bg{
  position:absolute;
  border-radius:50%;
  background:rgba(184,214,194,.13);
  filter:blur(6px);
  animation:float 10s ease-in-out infinite;
}

.bg:nth-child(1){
  width:240px;
  height:240px;
  left:-60px;
  top:-80px;
}

.bg:nth-child(2){
  width:180px;
  height:180px;
  right:-30px;
  bottom:-40px;
  animation-delay:2s;
}

@keyframes float{
  0%,100%{
    transform:translateY(0px);
  }
  50%{
    transform:translateY(-15px);
  }
}

/* ========================= */
/* 主布局 */
/* ========================= */

.wrapper{

  width:100%;
  height:100vh;

  display:flex;
  align-items:flex-start;
  justify-content:center;

  padding-top:80px;
}

/* ========================= */
/* 导航栏 */
/* ========================= */

.nav{

  position:relative;

  display:flex;
  align-items:center;
  gap:18px;

  padding:14px 18px;

  border-radius:999px;

  background:var(--nav-bg);

  border:1px solid rgba(221,234,226,.9);

  backdrop-filter:blur(18px);

  box-shadow:var(--shadow);
}

/* ========================= */
/* 普通按钮 */
/* ========================= */

.nav-item{

  position:relative;

  height:52px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:0 22px;

  border-radius:999px;

  color:var(--text-soft);

  cursor:pointer;

  transition:
    .4s cubic-bezier(.22,1,.36,1);

  user-select:none;
}

.nav-item:hover{

  background:var(--hover-bg);

  color:var(--text);

  transform:
    translateY(-2px);
}

/* active */

.nav-item.active{

  background:rgba(208,230,214,.55);

  color:var(--active);

  border:1px solid rgba(186,216,194,.55);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.75),
    0 4px 14px rgba(170,205,185,.15);
}

/* ========================= */
/* 分组菜单 */
/* ========================= */

.nav-group{

  position:relative;
}

/* 分组按钮 */

.group-trigger{

  height:52px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:0 22px;

  border-radius:999px;

  color:var(--text-soft);

  cursor:pointer;

  transition:.4s cubic-bezier(.22,1,.36,1);
}

.group-trigger:hover{

  background:var(--hover-bg);

  color:var(--text);

  transform:translateY(-2px);
}

/* hover 时展开 */

.nav-group:hover .dropdown{

  opacity:1;
  visibility:visible;

  transform:
    translateY(0px)
    scale(1);
}

/* ========================= */
/* 二级菜单 */
/* ========================= */

.dropdown{

  position:absolute;

  top:68px;
  left:0;

  min-width:240px;

  padding:14px;

  border-radius:28px;

  background:rgba(248,252,249,.82);

  backdrop-filter:blur(20px);

  border:1px solid rgba(220,234,226,.9);

  box-shadow:
    0 16px 40px rgba(124,148,136,.12);

  opacity:0;
  visibility:hidden;

  transform:
    translateY(10px)
    scale(.98);

  transition:
    .35s cubic-bezier(.22,1,.36,1);

}

/* 内部菜单项 */

.dropdown-item{

  display:flex;
  align-items:center;
  gap:14px;

  padding:16px 18px;

  border-radius:18px;

  cursor:pointer;

  color:var(--text-soft);

  transition:.35s ease;
}

.dropdown-item:hover{

  background:rgba(220,236,226,.7);

  color:var(--text);

  transform:translateX(4px);
}

/* ========================= */
/* icon */
/* ========================= */

.icon{

  width:19px;
  height:19px;

  stroke:currentColor;
  fill:none;

  stroke-width:1.75;
  stroke-linecap:round;
  stroke-linejoin:round;

  transition:.35s ease;
}

/* ========================= */
/* 文本 */
/* ========================= */

.label{

  font-size:16px;
  letter-spacing:.4px;
  font-weight:500;
}

/* ========================= */
/* 描述 */
/* ========================= */

.meta{

  display:flex;
  flex-direction:column;
  gap:4px;
}

.meta-title{

  font-size:15px;
  color:var(--text);
}

.meta-desc{

  font-size:12px;
  color:#90a19b;
}

/* ========================= */
/* 小箭头 */
/* ========================= */

.arrow{

  width:14px;
  height:14px;

  opacity:.5;

  transition:.35s ease;
}

.nav-group:hover .arrow{

  transform:rotate(180deg);
}

/* ========================= */
/* 小生长线 */
/* ========================= */

.nav-item::after,
.group-trigger::after{

  content:"";

  position:absolute;

  bottom:8px;
  left:50%;

  width:0%;
  height:2px;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(141,200,162,.8),
      transparent
    );

  transition:.4s ease;
}

.nav-item:hover::after,
.group-trigger:hover::after{

  width:60%;
  left:20%;
}

/* ========================= */
/* 响应式 */
/* ========================= */

@media (max-width:900px){

  .nav{
    flex-wrap:wrap;
    border-radius:30px;
  }

  .dropdown{
    left:50%;
    transform:translateX(-50%);
  }
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="bg"></div>

<div class="wrapper">

  <nav class="nav">

    <!-- 首页 -->

    <div class="nav-item active">

      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 11.5L12 4L20 11.5"/>
        <path d="M7 10.5V19H17V10.5"/>
      </svg>

      <span class="label">首页</span>

    </div>

    <!-- 创作 -->

    <div class="nav-group">

      <div class="group-trigger">

        <svg class="icon" viewBox="0 0 24 24">
          <path d="M8 8L4 12L8 16"/>
          <path d="M16 8L20 12L16 16"/>
        </svg>

        <span class="label">创作</span>

        <svg class="arrow icon" viewBox="0 0 24 24">
          <path d="M6 9L12 15L18 9"/>
        </svg>

      </div>

      <!-- dropdown -->

      <div class="dropdown">

        <div class="dropdown-item">

          <svg class="icon" viewBox="0 0 24 24">
            <path d="M8 8L4 12L8 16"/>
            <path d="M16 8L20 12L16 16"/>
          </svg>

          <div class="meta">

            <div class="meta-title">项目</div>

            <div class="meta-desc">
              开源 · 实验 · 技术实现
            </div>

          </div>

        </div>

        <div class="dropdown-item">

          <svg class="icon" viewBox="0 0 24 24">
            <path d="M5 6.5C5 5.67 5.67 5 6.5 5H18"/>
            <path d="M6.5 5C5.67 5 5 5.67 5 6.5V17.5C5 18.33 5.67 19 6.5 19H18V5"/>
            <path d="M8 9H15"/>
          </svg>

          <div class="meta">

            <div class="meta-title">博客</div>

            <div class="meta-desc">
              文章 · 思考 · 日常记录
            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- 社区 -->

    <div class="nav-group">

      <div class="group-trigger">

        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="2.5"/>
          <circle cx="17" cy="10" r="2.5"/>
          <path d="M5 18C5 15.8 6.8 14 9 14C11.2 14 13 15.8 13 18"/>
          <path d="M13 18C13 15.8 14.8 14 17 14C19.2 14 21 15.8 21 18"/>
        </svg>

        <span class="label">社区</span>

        <svg class="arrow icon" viewBox="0 0 24 24">
          <path d="M6 9L12 15L18 9"/>
        </svg>

      </div>

      <!-- dropdown -->

      <div class="dropdown">

        <div class="dropdown-item">

          <svg class="icon" viewBox="0 0 24 24">
            <path d="M20 11.5C20 15.09 16.42 18 12 18C10.84 18 9.74 17.8 8.74 17.44L4.5 19L5.74 15.48C5.27 14.32 5 12.96 5 11.5C5 7.91 8.58 5 13 5C17.42 5 20 7.91 20 11.5Z"/>
          </svg>

          <div class="meta">

            <div class="meta-title">留言</div>

            <div class="meta-desc">
              想法 · 交流 · 互动留言
            </div>

          </div>

        </div>

        <div class="dropdown-item">

          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="2.5"/>
            <circle cx="17" cy="10" r="2.5"/>
            <path d="M5 18C5 15.8 6.8 14 9 14C11.2 14 13 15.8 13 18"/>
            <path d="M13 18C13 15.8 14.8 14 17 14C19.2 14 21 15.8 21 18"/>
          </svg>

          <div class="meta">

            <div class="meta-title">友链</div>

            <div class="meta-desc">
              友站 · 同行 · 彼此链接
            </div>

          </div>

        </div>

      </div>

    </div>

  </nav>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>音量图标预览</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .icon-item {
            text-align: center;
        }
        .volume-icon {
            width: 64px;
            height: 64px;
            fill: #000000;
            overflow: visible;
        }
        .volume-icon .waves {
            fill: none;
            stroke: #000000;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .volume-icon .mute-x {
            fill: none;
            stroke: #000000;
            stroke-width: 8;
            stroke-linecap: round;
        }
        .label {
            margin-top: 8px;
            font-family: sans-serif;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- 高音量 -->
    <div class="icon-item">
        <svg class="volume-icon" viewBox="0 0 100 100">
            <!-- 喇叭主体 -->
            <path d="M10,30 L30,30 L60,10 L60,90 L30,70 L10,70 Z"/>
            <!-- 声波 -->
            <path d="M75,35 A20,20 0 0 1 75,65" fill="none" stroke="#000" stroke-width="8"/>
            <path d="M85,25 A30,30 0 0 1 85,75" fill="none" stroke="#000" stroke-width="8"/>
            <path d="M95,15 A40,40 0 0 1 95,85" fill="none" stroke="#000" stroke-width="8"/>
        </svg>
        <div class="label">高音量</div>
    </div>

    <!-- 中音量 -->
    <div class="icon-item">
        <svg class="volume-icon" viewBox="0 0 100 100">
            <!-- 喇叭主体 -->
            <path d="M10,30 L30,30 L60,10 L60,90 L30,70 L10,70 Z"/>
            <!-- 声波 -->
            <path d="M75,35 A20,20 0 0 1 75,65" fill="none" stroke="#000" stroke-width="8"/>
            <path d="M85,25 A30,30 0 0 1 85,75" fill="none" stroke="#000" stroke-width="8"/>
        </svg>
        <div class="label">中音量</div>
    </div>

    <!-- 低音量 -->
    <div class="icon-item">
        <svg class="volume-icon" viewBox="0 0 100 100">
            <!-- 喇叭主体 -->
            <path d="M10,30 L30,30 L60,10 L60,90 L30,70 L10,70 Z"/>
            <!-- 声波 -->
            <path d="M75,35 A20,20 0 0 1 75,65" fill="none" stroke="#000" stroke-width="8"/>
        </svg>
        <div class="label">低音量</div>
    </div>

    <!-- 静音 -->
    <div class="icon-item">
        <svg class="volume-icon" viewBox="0 0 100 100">
            <!-- 喇叭主体 -->
            <path d="M10,30 L30,30 L60,10 L60,90 L30,70 L10,70 Z"/>
            <!-- 叉号：两条直线，仅中心一点相交 -->
            <path class="mute-x" d="M70 30 L90 70 M90 30 L70 70"/>
        </svg>
        <div class="label">静音</div>
    </div>
</body>
</html>
